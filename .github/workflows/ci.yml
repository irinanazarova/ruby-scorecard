# Lint, security scan and tests, on every push and pull request.
#
# This runs on PRs as well as on main, which fly-deploy.yml deliberately does not: deploying is a
# main-only action, but a branch should be able to prove itself before it gets there.
#
# The FineWeb-Edu ONNX model (vendor/fwedu, 419 MB) is gitignored and NOT needed here. Only
# scripts/quality_core.rb loads it, and the scripts are standalone programs run by hand rather than
# part of the app or its test suite.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec rubocop --parallel

  security:
    name: Brakeman
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec brakeman --no-pager

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # The integration suite renders "/", which serves public/scorecard.html. public/ is
      # gitignored; populate it from the committed dist/ the same way fly-deploy.yml does.
      - run: cp -R dist/. public/
      - run: bin/rails db:test:prepare
      - run: bin/rails test

  # The generated half of the site is committed in dist/, and the generators read only data/ and
  # src/. So regenerating has to be a no-op: if it is not, dist/ was edited by hand or someone
  # changed a generator without rebuilding, and the deployed pages no longer match their source.
  # Cheap to check and it catches a class of drift nothing else would.
  generators:
    name: dist/ is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: ruby scripts/build.rb
      - run: git diff --exit-code -- dist/scorecard.html
        # A failure here means: run ./build.sh and commit dist/.

  # --- deploy -------------------------------------------------------------------------------
  #
  # Gated on every check above. This lives in the CI workflow rather than in its own file on
  # purpose: `needs` is enforced by Actions against THIS run and this exact commit, whereas a
  # separate workflow keyed on `workflow_run` has to re-derive the SHA and is easy to get subtly
  # wrong (it defaults to the branch tip, which by then may be a different commit).
  #
  # Before this gate, CI and the deploy were independent workflows racing on the same push: a red
  # test suite did not stop a release, and for several days the deploy was failing in 12 seconds on
  # a missing FLY_API_TOKEN while nothing said so.
  #
  # fly-deploy.yml is still there for a manual redeploy that carries no commit.
  deploy:
    name: Deploy to Fly
    needs: [ lint, security, test, generators ]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push cancels a queued (not yet running) older one.
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v4
      # The image build needs public/ populated, but /public/* is gitignored. The static site is
      # committed in dist/, so publish it with a plain copy: build.sh's last step, without
      # regenerating anything. Regeneration probes 94 sites over HTTP and belongs to
      # /update-scorecard, not to a deploy.
      - run: cp -R dist/. public/
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
