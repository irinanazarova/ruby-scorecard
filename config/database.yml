# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
# Paths point at /data, the Fly volume — NOT storage/, which lives in the container filesystem and
# is wiped on every deploy. Losing the cache database would throw away the pre-warmed analyses that
# make the demo instant, and losing the queue database would drop in-flight jobs.
#
# There is deliberately no `cable` database: Action Cable runs on AnyCable, so nothing polls a
# table for broadcasts. Leaving the entry here would make Rails try to migrate a database for a gem
# that is no longer installed.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_DIR", "/data") %>/production.sqlite3
  cache:
    <<: *default
    database: <%= ENV.fetch("DATABASE_DIR", "/data") %>/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DATABASE_DIR", "/data") %>/production_queue.sqlite3
    migrations_paths: db/queue_migrate
